<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Delivery!</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #1e053d 0%, #080010 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      overflow-x: hidden;
    }

    /* Title & Flying Cake */
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .flying-cake {
      display: inline-block;
      font-size: 2.6rem;
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(10deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    /* Subtitle */
    .subtitle {
      color: #ffb7c5;
      font-size: 1.3rem;
      margin-bottom: 25px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-shadow: 0 0 10px rgba(255, 183, 197, 0.7);
      transition: all 0.5s ease;
    }

    /* Chest Section & Slow Opening Animation */
    .chest-container {
      cursor: pointer;
      user-select: none;
      margin: 20px 0;
      display: inline-block;
      position: relative;
    }

    .epic-chest-img {
      width: 280px;
      max-width: 80vw;
      height: auto;
      filter: drop-shadow(0 0 25px #ffd700) drop-shadow(0 0 45px #d800ff);
      animation: epicGlow 2.2s infinite alternate ease-in-out;
      transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .chest-container:hover .epic-chest-img {
      transform: scale(1.08);
      filter: drop-shadow(0 0 35px #ffe600) drop-shadow(0 0 65px #f355ff);
    }

    @keyframes epicGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 20px #ffd700) drop-shadow(0 0 40px #b100e8); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 38px #ffee55) drop-shadow(0 0 70px #ff66fc); }
    }

    /* Slow Open Effect */
    .opening-chest {
      transform: scale(1.4) translateY(-20px) !important;
      filter: drop-shadow(0 0 60px #ffffff) drop-shadow(0 0 100px #00d4ff) !important;
      opacity: 0;
    }

    /* 3D Card Scene Setup */
    .card-scene {
      perspective: 1200px;
      display: none;
      margin-top: 10px;
    }

    .card-flipper {
      width: 310px;
      height: 460px;
      max-width: 85vw;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      animation: riseUp 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* THE FLIP ACTION AT THE END */
    .card-flipper.flipped {
      transform: rotateY(180deg) scale(1.05);
    }

    @keyframes riseUp {
      0% { opacity: 0; transform: scale(0.3) translateY(120px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Dark Blue Thunder Card Back */
    .card-back {
      background: radial-gradient(circle, #091e42 0%, #020c1b 100%);
      border: 3.5px solid #00d4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: thunderGlow 1.2s infinite alternate ease-in-out;
    }

    .thunder-icon {
      font-size: 75px;
      margin-bottom: 15px;
      animation: thunderPulse 0.4s infinite alternate;
      text-shadow: 0 0 20px #00d4ff, 0 0 40px #0055ff;
    }

    .card-back-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #79e2ff;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00d4ff;
    }

    /* Electric Thunder Glow Animation */
    @keyframes thunderGlow {
      0% { box-shadow: 0 0 20px #00d4ff, 0 0 40px #0055ff, inset 0 0 15px #00d4ff; }
      50% { box-shadow: 0 0 35px #00e1ff, 0 0 70px #0022ff, 0 0 90px #00d4ff, inset 0 0 25px #00ffff; }
      100% { box-shadow: 0 0 15px #0077ff, 0 0 30px #001199, inset 0 0 10px #0077ff; }
    }

    @keyframes thunderPulse {
      0% { opacity: 0.8; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.08); }
    }

    /* Card Front Side (Revealed Rating Card) */
    .card-front {
      transform: rotateY(180deg);
      border: 3.5px solid #ffd700;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.8), 0 15px 35px rgba(0, 0, 0, 0.9);
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
    }
  </style>
  <!-- Confetti script -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div id="chest-section">
    <h1>Special Delivery to Birthday Boy <span class="flying-cake">🎂</span></h1>
    <p class="subtitle" id="subtitleText">Tap to unlock chest</p>

    <div class="chest-container" id="chestContainer" onclick="openChest()">
      <img src="epic-chest.png" alt="Castle Crush Epic Chest" class="epic-chest-img" id="chestImg">
    </div>
  </div>

  <!-- 3D Card Container -->
  <div class="card-scene" id="cardScene">
    <div class="card-flipper" id="cardFlipper" onclick="flipToReveal()">
      
      <!-- BACK SIDE: Dark Blue Thunder Theme (Shown First) -->
      <div class="card-face card-back">
        <div class="thunder-icon">⚡</div>
        <div class="card-back-title">Epic Rating</div>
      </div>

      <!-- FRONT SIDE: Your Rating Card Image (Revealed on Flip) -->
      <div class="card-face card-front">
        <img src="rating-card.png" alt="Brother Rating Card">
      </div>

    </div>
  </div>

  <script>
    let chestOpened = false;
    let cardFlipped = false;

    function openChest() {
      if (chestOpened) return;
      chestOpened = true;

      const chestImg = document.getElementById('chestImg');
      const chestSection = document.getElementById('chest-section');
      const cardScene = document.getElementById('cardScene');
      const subtitleText = document.getElementById('subtitleText');

      // 1. Slow Chest Opening
      chestImg.classList.add('opening-chest');

      // 2. Initial Electric Confetti
      confetti({
        particleCount: 100,
        spread: 90,
        origin: { y: 0.6 },
        colors: ['#00d4ff', '#0055ff', '#ffd700', '#ffffff']
      });

      // 3. Hide chest, display face-down dark blue card
      setTimeout(() => {
        chestImg.style.display = 'none';
        subtitleText.innerText = "⚡ Tap the card to flip and reveal! ⚡";
        subtitleText.style.color = "#00d4ff";
        subtitleText.style.textShadow = "0 0 12px #00d4ff";
        cardScene.style.display = "block";
      }, 1000);
    }

    function flipToReveal() {
      if (cardFlipped) return;
      cardFlipped = true;

      const cardFlipper = document.getElementById('cardFlipper');
      const subtitleText = document.getElementById('subtitleText');

      // 1. EXECUTE THE 3D FLIP ANIMATION
      cardFlipper.classList.add('flipped');

      // 2. Update heading text
      subtitleText.innerText = "🎉 Official Brother Evaluation 🎉";
      subtitleText.style.color = "#ffd700";
      subtitleText.style.textShadow = "0 0 12px #ffd700";

      // 3. Sprinkle & Confetti Explosion on Reveal
      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        confetti({
          particleCount: 40,
          startVelocity: 32,
          spread: 360,
          origin: { x: Math.random(), y: Math.random() - 0.2 },
          colors: ['#ffd700', '#ff007f', '#00d4ff', '#ffffff', '#a855f7', '#ff9f43']
        });
      }, 200);
    }
  </script>
</body>
</html>
