<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Delivery!</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #2a085c 0%, #0d0118 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      overflow-x: hidden;
    }

    /* Title & Flying Cake */
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    .flying-cake {
      display: inline-block;
      font-size: 2.6rem;
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(10deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    /* Subtitle */
    .subtitle {
      color: #ffb7c5;
      font-size: 1.3rem;
      margin-bottom: 30px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-shadow: 0 0 8px rgba(255, 183, 197, 0.6);
    }

    /* Castle Crush Epic Chest Glow & Container */
    .chest-container {
      cursor: pointer;
      user-select: none;
      margin: 20px 0;
      display: inline-block;
      position: relative;
    }

    .epic-chest-img {
      width: 280px;
      max-width: 80vw;
      height: auto;
      filter: drop-shadow(0 0 25px #ffd700) drop-shadow(0 0 45px #d800ff);
      animation: epicGlow 2.2s infinite alternate ease-in-out;
      transition: transform 0.2s ease;
    }

    .chest-container:hover .epic-chest-img {
      transform: scale(1.08);
      filter: drop-shadow(0 0 35px #ffe600) drop-shadow(0 0 65px #f355ff);
    }

    /* Pulsing Epic Aura */
    @keyframes epicGlow {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 20px #ffd700) drop-shadow(0 0 40px #b100e8);
      }
      100% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 38px #ffee55) drop-shadow(0 0 70px #ff66fc);
      }
    }

    /* Shake on Tap */
    .shake {
      animation: shake 0.5s ease-in-out !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px) rotate(-6deg); }
      40% { transform: translateX(12px) rotate(6deg); }
      60% { transform: translateX(-12px) rotate(-6deg); }
      80% { transform: translateX(12px) rotate(6deg); }
    }

    /* Rating Card Reveal */
    .card-container {
      display: none;
      margin-top: 10px;
      animation: popIn 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .card-container h2 {
      color: #ffd700;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    .card-container img {
      max-width: 90vw;
      width: 440px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(216, 0, 255, 0.4), 0 15px 35px rgba(0, 0, 0, 0.9);
      border: 3px solid #ffd700;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.3) translateY(50px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
  <!-- Confetti script -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div id="chest-section">
    <h1>Special Delivery to Birthday Boy <span class="flying-cake">🎂</span></h1>
    <p class="subtitle">Tap to unlock chest</p>
    <div class="chest-container" id="chestContainer" onclick="openChest()">
      <img src="epic-chest.png" alt="Castle Crush Epic Chest" class="epic-chest-img" id="chestImg">
    </div>
  </div>

  <div class="card-container" id="ratingCard">
    <h2>🎉 Official Brother Evaluation 🎉</h2>
    <img src="rating-card.png" alt="Brother Rating Card">
  </div>

  <script>
    function openChest() {
      const chestImg = document.getElementById('chestImg');
      const chestContainer = document.getElementById('chestContainer');
      const card = document.getElementById('ratingCard');
      const chestSection = document.getElementById('chest-section');

      // Trigger shake animation
      chestContainer.classList.add('shake');

      // Gold & Pink Confetti Burst
      confetti({
        particleCount: 140,
        spread: 90,
        origin: { y: 0.6 },
        colors: ['#ffd700', '#ff66fc', '#ffffff', '#e056fd']
      });

      // Scale up and fade during unlock
      setTimeout(() => {
        chestImg.style.transform = 'scale(1.2)';
        chestImg.style.opacity = '0.5';
      }, 300);

      // Hide chest & reveal rating card
      setTimeout(() => {
        chestSection.style.display = 'none';
        card.style.display = 'block';

        confetti({
          particleCount: 90,
          angle: 60,
          spread: 60,
          origin: { x: 0 },
          colors: ['#ffd700', '#d800ff']
        });
        confetti({
          particleCount: 90,
          angle: 120,
          spread: 60,
          origin: { x: 1 },
          colors: ['#ffd700', '#d800ff']
        });
      }, 750);
    }
  </script>
</body>
</html>
